<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="left">
            <h1>Let's Chat</h1>

            <p>
                Whether you have a question, want to
                start a project or simply want to connect.
            </p>

            <p>
                Feel free to send me a message in the
                contact form.
            </p>
        </div>

        <div class="right">
            <h1>Contact</h1>

            <form>
                <label>Name *</label>
                <input type="text">

                <label>Email *</label>
                <input type="email">

                <label>Company</label>
                <input type="text">

                <label>Phone</label>
                <input type="text">

                <label>Message</label>
                <textarea></textarea>

                <button type="submit">SUBMIT</button>
            </form>
        </div>

    </div>

</body>
</html>
